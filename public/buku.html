<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Data Buku</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>Data Buku</h2>

<div class="row">

<div class="col">
<input id="judul" class="form-control" placeholder="Judul Buku">
</div>

<div class="col">
<input id="penulis" class="form-control" placeholder="Penulis">
</div>

<div class="col">
<input id="stok" class="form-control" type="number" placeholder="Stok">
</div>

<div class="col">
<button onclick="simpan()" class="btn btn-success">
Simpan
</button>
</div>

</div>

<hr>

<table class="table table-bordered">

<thead>

<tr>
<th>Judul</th>
<th>Penulis</th>
<th>Stok</th>
<th>Aksi</th>
</tr>

</thead>

<tbody id="data">

</tbody>

</table>

</div>

<script src="js/buku.js"></script>

</body>
</html>
