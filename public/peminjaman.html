<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Peminjaman</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>Data Peminjaman</h2>

<div class="row g-2">

<div class="col">
<input id="nama" class="form-control" placeholder="Nama Peminjam">
</div>

<div class="col">
<select id="buku" class="form-control"></select>
</div>

<div class="col">
<select id="status" class="form-control">
<option>Dipinjam</option>
<option>Dikembalikan</option>
</select>
</div>

<div class="col">
<button class="btn btn-success" onclick="simpan()">
Simpan
</button>
</div>

</div>

<hr>

<table class="table table-bordered">

<thead>

<tr>

<th>Nama</th>

<th>Buku</th>

<th>Status</th>

<th>Aksi</th>

</tr>

</thead>

<tbody id="data"></tbody>

</table>

</div>

<script src="js/peminjaman.js"></script>

</body>

</html>
